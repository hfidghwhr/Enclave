<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enclave</title>


<style>

body {

    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;

}


h1 {

    text-align: center;

}



#status {

    text-align: center;
    color: green;

}



#login,
#chat {

    max-width: 500px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;

}



input {

    width: 100%;
    padding: 12px;
    margin-top: 10px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;

}



button {

    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: black;
    color: white;
    cursor: pointer;

}



#messages {

    height: 350px;
    overflow-y: auto;
    padding: 10px;
    background: #eeeeee;
    border-radius: 12px;
    margin-bottom: 10px;

}



.message {

    margin: 10px;
    display: flex;
    flex-direction: column;

}



.myMessage {

    align-items: flex-end;

}



.otherMessage {

    align-items: flex-start;

}



.username {

    font-size: 12px;
    color: gray;

}



.text {

    padding: 10px 15px;
    border-radius: 15px;
    background: white;
    max-width: 70%;

}



.myMessage .text {

    background: black;
    color: white;

}



.time {

    font-size: 11px;
    color: gray;
    margin-top: 3px;

}



.deleteButton {

    width: auto;
    padding: 5px 10px;
    margin-top: 5px;
    font-size: 12px;
    background: #d9534f;

}


</style>

</head>



<body>


<h1>Enclave</h1>


<p id="status">
Connessione in corso...
</p>



<div id="login">


<h2>Benvenuto su Enclave</h2>


<input 
id="nameInput"
type="text"
placeholder="Il tuo nome..."
>


<button id="enterButton">
Entra in Enclave
</button>


</div>




<div id="chat" style="display:none;">


<h3 id="welcome"></h3>

    <div id="onlineUsers">

<h4>Utenti online:</h4>

<div id="usersList">
</div>

</div>



<div id="messages"></div>



<input 
id="messageInput"
type="text"
placeholder="Scrivi un messaggio..."
>


<button id="sendButton">
Invia
</button>



</div>





<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import { 
getFirestore, 
collection, 
addDoc, 
onSnapshot,
orderBy,
query,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    import {
getDatabase,
ref,
set,
onValue,
onDisconnect
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";




const firebaseConfig = {


apiKey: "AIzaSyBBb1dZfvhs6ZAcWcRa17rn0nKVDjvs9a8",
authDomain: "enclave-v1.firebaseapp.com",
projectId: "enclave-v1",
storageBucket: "enclave-v1.firebasestorage.app",
messagingSenderId: "157107813259",
appId: "1:157107813259:web:1371c34306d47d73478d8e"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const rtdb = getDatabase(app, "https://enclave-v1-default-rtdb.europe-west1.firebasedatabase.app/");



document.getElementById("status").innerHTML =
"Firebase collegato ✔";






const login = document.getElementById("login");

const chat = document.getElementById("chat");

const nameInput = document.getElementById("nameInput");

const enterButton = document.getElementById("enterButton");

const welcome = document.getElementById("welcome");

const messageInput = document.getElementById("messageInput");

const sendButton = document.getElementById("sendButton");

const messagesDiv = document.getElementById("messages");

const usersList = document.getElementById("usersList");



let username = "";

function setUserOnline(){


const userRef = ref(rtdb, "users/" + username);


set(userRef, {

    online: true

});


onDisconnect(userRef).set({

    online: false

});


}

const usersRef = ref(rtdb, "users");

onValue(usersRef,(snapshot)=>{

    usersList.innerHTML = "";

    snapshot.forEach((child) => {

        const user = child.key;
        const data = child.val();

        if (data.online) {

            const p = document.createElement("p");

            p.textContent = "🟢 " + user;

            usersList.appendChild(p);

        }

    });


});



const savedName = localStorage.getItem("enclaveUsername");



if(savedName){


username = savedName;


login.style.display = "none";

chat.style.display = "block";


welcome.innerHTML =
"Bentornato " + username + " 👋";

setUserOnline();

}




enterButton.addEventListener("click",()=>{


const name = nameInput.value.trim();


if(name==="") return;


username=name;


localStorage.setItem(
"enclaveUsername",
username
);


login.style.display="none";

chat.style.display="block";


welcome.innerHTML =
"Bentornato " + username + " 👋";

setUserOnline();
    
});





async function sendMessage(){


const text = messageInput.value.trim();


if(text==="") return;



await addDoc(collection(db,"messages"),{


username: username,

text:text,

timestamp: Date.now()


});



messageInput.value="";


}



sendButton.addEventListener("click",sendMessage);



messageInput.addEventListener("keydown",(event)=>{


if(event.key==="Enter"){

sendMessage();

}


});

    




const messagesQuery = query(

collection(db,"messages"),

orderBy("timestamp")

);





onSnapshot(messagesQuery,(snapshot)=>{


messagesDiv.innerHTML="";



snapshot.forEach((docSnapshot)=>{


const message = docSnapshot.data();



const container=document.createElement("div");


container.classList.add("message");



if(message.username===username){


container.classList.add("myMessage");


}

else{


container.classList.add("otherMessage");


}





const user=document.createElement("div");


user.classList.add("username");


user.textContent=message.username;






const text=document.createElement("div");


text.classList.add("text");


text.textContent=message.text;






const time=document.createElement("div");


time.classList.add("time");



if(message.timestamp){


const date = new Date(message.timestamp);



time.textContent =

date.getHours()
.toString()
.padStart(2,"0")

+

":"

+

date.getMinutes()
.toString()
.padStart(2,"0");


}







container.appendChild(user);


container.appendChild(text);


container.appendChild(time);








// ELIMINAZIONE MESSAGGIO PROPRIO


if(message.username===username){



const deleteButton=document.createElement("button");



deleteButton.textContent="Elimina";



deleteButton.classList.add("deleteButton");





deleteButton.addEventListener("click", async ()=>{



await deleteDoc(

doc(db,"messages",docSnapshot.id)

);



});





container.appendChild(deleteButton);



}








messagesDiv.appendChild(container);



});






// SCROLL AUTOMATICO IN BASSO


messagesDiv.scrollTop = messagesDiv.scrollHeight;



});



</script>


</body>

</html>
