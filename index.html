<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enclave</title>

</head>


<body>

    <h1>Enclave</h1>


    <p id="status">Connessione in corso...</p>


    <!-- SCHERMATA ACCESSO -->

    <div id="login">


        <h2>Benvenuto su Enclave</h2>


        <input 
            id="nameInput" 
            type="text" 
            placeholder="Il tuo nome..."
        >


        <button id="enterButton">
            Entra in Enclave
        </button>


    </div>



    <!-- CHAT -->

    <div id="chat" style="display:none;">


        <h3 id="welcome"></h3>


        <div id="messages"></div>


        <input 
            id="messageInput" 
            type="text" 
            placeholder="Scrivi un messaggio..."
        >


        <button id="sendButton">
            Invia
        </button>


    </div>



    <!-- FIREBASE -->
    <script type="module">


        // Import Firebase

        import { initializeApp } 
        from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot,
            orderBy,
            query
        }
        from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



        // Configurazione Firebase

        const firebaseConfig = {

           apiKey: "AIzaSyBBb1dZfvhs6ZAcWcRa17rn0nKVDjvs9a8",
           authDomain: "enclave-v1.firebaseapp.com",
           projectId: "enclave-v1",
           storageBucket: "enclave-v1.firebasestorage.app",
           messagingSenderId: "157107813259",
           appId: "1:157107813259:web:1371c34306d47d73478d8e"

        };



        // Avvio Firebase

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        console.log("Firebase collegato correttamente!");

        document.getElementById("status").innerHTML =
        "Firebase collegato ✔";



        // ELEMENTI

        const login = document.getElementById("login");

        const chat = document.getElementById("chat");

        const nameInput = document.getElementById("nameInput");

        const enterButton = document.getElementById("enterButton");

        const welcome = document.getElementById("welcome");


        const messageInput = document.getElementById("messageInput");

        const sendButton = document.getElementById("sendButton");

        const messagesDiv = document.getElementById("messages");



        let username = "";



        // CONTROLLO SE IL NOME ESISTE GIÀ


        const savedName = localStorage.getItem("enclaveUsername");


        if(savedName){


            username = savedName;


            login.style.display = "none";

            chat.style.display = "block";


            welcome.innerHTML = 
            "Bentornato " + username + " 👋";


        }



        // ACCESSO


        enterButton.addEventListener("click", () => {


            const name = nameInput.value.trim();


            if(name === "") return;


            username = name;


            localStorage.setItem(
                "enclaveUsername",
                username
            );


            login.style.display = "none";


            chat.style.display = "block";


            welcome.innerHTML =
            "Bentornato " + username + " 👋";


        });



        // INVIO MESSAGGIO


        sendButton.addEventListener("click", async () => {


            const text = messageInput.value.trim();


            if(username === "" || text === "") return;



            await addDoc(collection(db, "messages"), {


                username: username,

                text: text,

                timestamp: new Date()


            });


            messageInput.value = "";


        });



        // LETTURA MESSAGGI


        const messagesQuery = query(

            collection(db, "messages"),

            orderBy("timestamp")

        );



        onSnapshot(messagesQuery, (snapshot) => {


            messagesDiv.innerHTML = "";



            snapshot.forEach((doc) => {


                const message = doc.data();


                const p = document.createElement("p");


                p.textContent =
                message.username + ": " + message.text;


                messagesDiv.appendChild(p);


            });


        });



    </script>


</body>

</html>
